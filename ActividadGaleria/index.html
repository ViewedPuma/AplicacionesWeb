<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria Virtual</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <div class="imgCamara">
            <img src="./Recursos/LogoCamara.png" alt="Camara">
        </div>
        <div class="imgUser">
            <img src="./Recursos/LogoUser.png" alt="Logo Usuario">
        </div>
        

    </header>
    <main>
        <section>
            <div class="section_MisFotos">
                <h1> Mis fotos</h1>
                <button class="section_MisFotos_btn">
                    Upload
                    <img src="./Recursos/FotoPlus.png" alt="Agregar">
                </button>
            </div>
            <div class="section_MisFotosFotos">
                <img src="./Recursos/Foto1.png" alt="Foto">
                <img src="./Recursos/Foto1.png" alt="Foto">
                <img src="./Recursos/Foto2.png" alt="Foto">
                <img src="./Recursos/Foto2.png" alt="Foto">
                <img src="./Recursos/Foto3.png" alt="Foto">
                <img src="./Recursos/Foto3.png" alt="Foto">
            </div>
        </section>

        <section>
            <div class="section_MisAlbums">
                <h1>Mis Albums</h1>
                <button></button>
            </div>
            <div class="section_MisAlbums">
                <div class="section_MisAlbums_Card">
                    <div>
                        <h2>Viaje 2025</h2>
                        <button>Ver</button>
                    </div>
                    <div>
                        <img src="./Recursos/Foto4.png" alt="Foto Album">
                    </div>
                </div>
                <div class="section_MisAlbums_Card">
                    <div>
                        <h2>Vacaciones</h2>
                        <button>Ver</button>
                    </div>
                    <div>
                        <img src="./Recursos/Foto5.png" alt="Foto Album">
                    </div>
                </div>
            </div>
        </section>

    </main>
    <footer>
        <p>Galeria Digital 2025</p>
    </footer>
    
</body>
</html>
