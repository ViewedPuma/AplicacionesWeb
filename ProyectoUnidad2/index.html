<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dogopedia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
    <header>

    </header>
    <main>
        <div class="main_Welcome-Section">
            <img src="" alt="DogoLogo">
            <h1> ¡Bienvenido!</h1>
        </div>
        <div class="main_Login-Section">
            <form>
                <input  type="text" name="datoUsuario" id="usuario" placeholder="Numero de celular o correo electronico"required>
                <input type="password" name="passwordUsuario" id="password" placeholder="Contraseña" required>
                <a href="#">¿Olvidaste tu contraseña?</a>
                <button type="submit">Iniciar Sesion</button>
            </form>
        </div>
        <div class="main_LoginOption-Section">
            <p class="divider">Continuar con</p>
            <div class="social-buttons">
                <button class="buttons">
                    <img src="./recursos/Googleimg.png" alt="Google">
                </button>
                <button class="buttons">
                    <img src="./recursos/FacebookImg.png" alt="Facebook">
                </button>
                <button class="buttons">
                    <img src="./recursos/Appleimg.png" alt="Apple">
                </button>
            </div>
            <p></p>
            
        </div>
    </main>
    <footer>

    </footer>
