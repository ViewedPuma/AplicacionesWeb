<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="./Home.css">
    <script src="./HomeDesign.js" defer></script>
    <script>
        // Verificamos si hay un token en el localStorage
        const token = localStorage.getItem('authToken');

        // Si no hay token, redirige al login
        if (!token) {
            
            window.location.href = './index.html';
        }
    </script>
    
</head>
<body>
     <div class="container">
        <div class="header">
            <h1>Mis Proyectos</h1>
            <button class="add-btn" onclick="openModal()">
                <span>+</span>
                Agregar Proyecto
            </button>
        </div>

        <div class="projects-panel">
            <div id="projectsGrid" class="projects-grid">
                <!-- Los proyectos iran aqui de forma dinamica -->
            </div>
        </div>
    </div>

    <!-- Modal para agregar/editar proyecto -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Agregar Proyecto</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="projectForm" onsubmit="saveProject(event)">
                <div class="form-group">
                    <label for="projectName">Nombre del Proyecto</label>
                    <input type="text" id="projectName" placeholder="Nombre del proyecto" required>
                </div>
                <div class="form-group">
                    <label for="projectDescription">Descripción</label>
                    <textarea id="projectDescription" placeholder="Describe tu proyecto..." required></textarea>
                </div>
                <div class="form-group">
                    <label for="projectTechnologies">Tecnologías</label>
                    <input type="text" id="projectTechnologies" placeholder="Tecnologías utilizadas..." required>
                </div>
                <div class="form-group">
                    <label for="projectRepository">Repositorio</label>
                    <input type="url" id="projectRepository" placeholder="URL del repositorio...">
                </div>
                <div class="form-group">
                    <label for="projectImageUrl">Imagen</label>
                    <input type="url" id="projectImageUrl" placeholder="URL de la imagen..." required>
                </div>
                <div class="form-buttons">
                    <button type="button" class="btn-secondary" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
